name: Build Windows EXE

# Builds JRZ's Shooter Game into a Windows .exe (installer + portable)
# every time you push to main, or manually from the Actions tab.
# The finished .exe files show up under the run's "Artifacts" section,
# and are also attached to a GitHub Release when you push a tag like "v1.0.0".

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run dist:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jrz-shooter-game-windows
          path: |
            dist/*.exe
            dist/win-unpacked/**

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
